[project]
name = "product-catalog"
version = "0.1.0"
description = "product catalog component for the cencori billing system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff]
line-length = 105
target-version = "py313"
exclude = [
    ".venv",
    "alembic/versions/**",
    "alembic/env.py",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I"] 

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
